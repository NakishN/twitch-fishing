<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рыбалка — таблица лидеров</title>
    <link rel="stylesheet" href="overlay.css">
    <link rel="stylesheet" href="leaderboard.css">
</head>
<body>
    <section id="board" class="board" aria-live="polite">
        <header class="head">
            <div class="head-text">
                <h1 id="title" class="title"></h1>
                <span id="period" class="period"></span>
            </div>
            <div id="dots" class="dots"></div>
        </header>
        <div id="rows" class="rows"></div>
        <div id="empty" class="empty" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c3-5 8-6 12-3l4-2-1 4 2 3-4 1c-4 3-9 2-13-3z"/><circle cx="8.5" cy="11" r=".6" fill="currentColor"/></svg>
            <span id="empty-text"></span>
        </div>
        <div class="timer"><i id="timer-fill"></i></div>
    </section>

    <script src="overlay.js"></script>
    <script src="leaderboard.js"></script>
</body>
</html>
